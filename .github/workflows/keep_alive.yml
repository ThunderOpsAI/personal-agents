name: Keep-Alive Ping

on:
  schedule:
    # Run every 14 minutes to prevent Render free tier cold starts
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request
        run: |
          # Replace with your actual deployed Render URL if different
          curl -sSf https://rumble-os-backend.onrender.com/healthz > /dev/null || exit 1
