<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="500" height="240" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="12" x2="250" y2="228" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SETUP</text>
  <text x="274" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">ACTIVE MOVEMENT</text>
  
  <!-- Title Badge -->
  <rect x="24" y="38" width="210" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
  <text x="32" y="53" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">WALL CALF: GASTROCNEMIUS</text>
  
  <!-- Left Panel: Wall & Split Stance Setup -->
  <line x1="185" y1="70" x2="185" y2="195" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="75" y1="195" x2="200" y2="195" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <!-- Figure in upright split stance -->
  <circle cx="140" cy="82" r="10" fill="#f8fafc"/>
  <line x1="140" y1="92" x2="138" y2="140" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <line x1="140" y1="102" x2="182" y2="102" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <!-- Front leg -->
  <line x1="138" y1="140" x2="158" y2="168" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <line x1="158" y1="168" x2="158" y2="193" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Back leg straight -->
  <line x1="138" y1="140" x2="102" y2="193" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <text x="125" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Hands on wall, split stance, toes forward</text>

  <!-- Right Panel: Active Gastrocnemius Stretch -->
  <line x1="435" y1="70" x2="435" y2="195" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="325" y1="195" x2="450" y2="195" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <!-- Figure leaning forward, back leg straight -->
  <circle cx="400" cy="84" r="10" fill="#00e5ff"/>
  <line x1="400" y1="94" x2="386" y2="138" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="396" y1="104" x2="432" y2="104" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <!-- Front leg bent deeper -->
  <line x1="386" y1="138" x2="412" y2="165" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="412" y1="165" x2="408" y2="193" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Back leg locked straight, heel anchored -->
  <line x1="386" y1="138" x2="345" y2="193" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="345" cy="193" r="3.5" fill="#38bdf8"/>
  <text x="375" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">Back knee straight, heel grounded into floor</text>
</svg>
