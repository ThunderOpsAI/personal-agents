<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <title>Swimming &amp; Posterior Chain Endurance</title>
  <desc>Clinical Pilates swimming modification in prone position with pelvic support pillow, neck in line with spine, and rhythmic low contralateral arm and leg fluttering.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="500" height="240" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="12" x2="250" y2="228" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SETUP: PRONE WITH PELVIC PILLOW</text>
  <text x="274" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">ACTIVE CONTRALATERAL FLUTTER</text>
  
  <!-- Title Badge -->
  <rect x="24" y="38" width="235" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
  <text x="32" y="53" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">PILATES SWIMMING (POSTERIOR CHAIN)</text>
  
  <!-- Left Panel: Setup -->
  <line x1="45" y1="175" x2="215" y2="175" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Pelvic support pillow / block under abdomen -->
  <rect x="110" y="166" width="36" height="8" rx="3" fill="#38bdf8" opacity="0.35"/>
  <!-- Neutral Prone Spine, head hovering 1 inch face down -->
  <circle cx="80" cy="155" r="8" fill="#f8fafc"/>
  <line x1="88" y1="160" x2="145" y2="164" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Arms long overhead on floor -->
  <line x1="95" y1="162" x2="60" y2="170" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <!-- Legs long on floor -->
  <line x1="145" y1="164" x2="195" y2="170" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <text x="125" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Prone with pillow under pelvis; cervical neck long and eyes down</text>

  <!-- Right Panel: Active Swimming Flutter -->
  <line x1="295" y1="175" x2="465" y2="175" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Pelvic support pillow -->
  <rect x="360" y="166" width="36" height="8" rx="3" fill="#38bdf8" opacity="0.35"/>
  <!-- Head long and neutral, gaze fixed straight down at mat -->
  <circle cx="330" cy="155" r="8" fill="#00e5ff"/>
  <line x1="338" y1="160" x2="395" y2="164" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Right arm floating 1-2 inches (low height) -->
  <line x1="345" y1="162" x2="310" y2="152" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <!-- Left arm anchored on mat -->
  <line x1="345" y1="164" x2="315" y2="172" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- Left leg floating 1-2 inches with glute activation -->
  <line x1="395" y1="164" x2="445" y2="154" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Right leg anchored on mat -->
  <line x1="395" y1="164" x2="445" y2="172" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Motion indicator -->
  <path d="M 307 148 L 310 152 L 313 148 M 447 150 L 445 154 L 443 150" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="375" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Float opposite arm and leg 1-2 inches; zero lumbar hyperextension</text>
</svg>
