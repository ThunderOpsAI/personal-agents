<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="500" height="240" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="12" x2="250" y2="228" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SETUP</text>
  <text x="274" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">ACTIVE MOVEMENT</text>
  
  <!-- Title Badge -->
  <rect x="24" y="38" width="212" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
  <text x="32" y="53" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">ANKLE DORSIFLEXION &amp; ARCH</text>
  
  <!-- Left Panel: Half-Kneeling Wall Setup -->
  <line x1="185" y1="75" x2="185" y2="195" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="65" y1="195" x2="200" y2="195" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <circle cx="122" cy="95" r="9" fill="#f8fafc"/>
  <line x1="122" y1="104" x2="122" y2="148" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Front leg 90 deg -->
  <line x1="122" y1="148" x2="155" y2="148" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <line x1="155" y1="148" x2="155" y2="193" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Back kneeling leg -->
  <line x1="122" y1="148" x2="122" y2="193" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <line x1="122" y1="193" x2="88" y2="193" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <text x="125" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Half-kneeling, toes 3 inches from wall</text>

  <!-- Right Panel: Knee-to-Wall Dorsiflexion Glide & Arch Roll -->
  <line x1="435" y1="75" x2="435" y2="195" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="315" y1="195" x2="450" y2="195" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <circle cx="385" cy="95" r="9" fill="#00e5ff"/>
  <line x1="385" y1="104" x2="385" y2="148" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Front knee gliding to touch wall while heel stays flat -->
  <line x1="385" y1="148" x2="431" y2="152" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="431" y1="152" x2="405" y2="193" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="405" cy="193" r="3.5" fill="#38bdf8"/>
  <line x1="385" y1="148" x2="372" y2="193" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="372" y1="193" x2="338" y2="193" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <text x="375" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">Glide knee toward wall keeping heel anchored</text>
</svg>
