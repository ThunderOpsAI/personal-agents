<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <title>Deadbug &amp; Lumbar Control</title>
  <desc>Clinical Pilates Deadbug stabilization showing supine tabletop position, antagonistic arm and leg reach, and rigid neutral lumbar spine.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="500" height="240" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="12" x2="250" y2="228" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SETUP: 90/90 DEADBUG</text>
  <text x="274" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">OPPOSITE LIMB REACH</text>
  
  <!-- Title Badge -->
  <rect x="24" y="38" width="220" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
  <text x="32" y="53" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">DEADBUG &amp; LUMBAR CONTROL</text>
  
  <!-- Left Panel: Setup -->
  <line x1="45" y1="180" x2="215" y2="180" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Head grounded -->
  <circle cx="70" cy="168" r="9" fill="#f8fafc"/>
  <line x1="79" y1="171" x2="135" y2="171" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Arms vertical to ceiling -->
  <line x1="100" y1="171" x2="100" y2="125" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Tabletop 90/90 legs -->
  <line x1="135" y1="171" x2="135" y2="130" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <line x1="135" y1="130" x2="175" y2="130" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <text x="125" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Lumbar spine locked flat, arms vertical, knees 90° tabletop</text>

  <!-- Right Panel: Active Antagonistic Reach -->
  <line x1="295" y1="180" x2="465" y2="180" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="320" cy="168" r="9" fill="#00e5ff"/>
  <line x1="329" y1="171" x2="385" y2="171" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Right arm reaches overhead -->
  <line x1="350" y1="171" x2="310" y2="148" stroke="#00e5ff" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Left arm stays vertical -->
  <line x1="350" y1="171" x2="350" y2="125" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- Right leg extends outward (heel hover) -->
  <line x1="385" y1="171" x2="445" y2="155" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Left leg stays in tabletop -->
  <line x1="385" y1="171" x2="385" y2="130" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="385" y1="130" x2="415" y2="130" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Core indicator -->
  <circle cx="365" cy="171" r="3" fill="#38bdf8"/>
  <text x="375" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Extend opposite arm and heel; zero arching or pelvic tilt</text>
</svg>
