<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="500" height="240" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="12" x2="250" y2="228" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SETUP</text>
  <text x="274" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">ACTIVE MOVEMENT</text>
  
  <!-- Title Badge -->
  <rect x="24" y="38" width="210" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
  <text x="32" y="53" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">SIDE-LYING QUADRICEPS STRETCH</text>
  
  <!-- Left Panel: Side-Lying Base with Bottom Knee Flexed -->
  <line x1="40" y1="175" x2="215" y2="175" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="68" cy="155" r="9" fill="#f8fafc"/>
  <line x1="78" y1="158" x2="132" y2="158" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Bottom knee flexed forward for stability -->
  <line x1="132" y1="158" x2="158" y2="170" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="158" y1="170" x2="180" y2="170" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Top leg extended prior to bend -->
  <line x1="132" y1="158" x2="195" y2="158" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <text x="125" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Bottom knee bent forward, lumbar spine neutral</text>

  <!-- Right Panel: Active Ankle-to-Glute Quad Stretch -->
  <line x1="290" y1="175" x2="465" y2="175" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="318" cy="155" r="9" fill="#00e5ff"/>
  <line x1="328" y1="158" x2="382" y2="158" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="382" y1="158" x2="408" y2="170" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Top thigh aligned, knee flexed back -->
  <line x1="382" y1="158" x2="432" y2="156" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="432" y1="156" x2="395" y2="134" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Hand holding ankle -->
  <line x1="342" y1="154" x2="395" y2="134" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <text x="375" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">Draw ankle toward glute, gently tuck pelvis</text>
</svg>
