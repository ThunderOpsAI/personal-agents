<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="500" height="240" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="12" x2="250" y2="228" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SETUP</text>
  <text x="274" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">ACTIVE MOVEMENT</text>
  
  <!-- Title Badge -->
  <rect x="24" y="38" width="210" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
  <text x="32" y="53" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">TOS FIRST RIB &amp; PLEXUS GLIDE</text>
  
  <!-- Left Panel: Seated First Rib Strap Depression -->
  <circle cx="125" cy="84" r="10" fill="#f8fafc"/>
  <line x1="125" y1="94" x2="125" y2="155" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <line x1="125" y1="155" x2="105" y2="192" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <line x1="125" y1="155" x2="145" y2="192" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Strap draped diagonally from shoulder base to opposite hip -->
  <line x1="112" y1="100" x2="145" y2="150" stroke="#38bdf8" stroke-width="3" stroke-dasharray="3,2"/>
  <line x1="125" y1="108" x2="145" y2="148" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <text x="125" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Gentle downward strap traction on first rib on exhale</text>

  <!-- Right Panel: Brachial Plexus Tension-Free Glide -->
  <circle cx="368" cy="84" r="10" fill="#00e5ff"/>
  <line x1="365" y1="94" x2="365" y2="155" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="365" y1="155" x2="345" y2="192" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="365" y1="155" x2="385" y2="192" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Smooth lateral arm sweep -->
  <line x1="365" y1="110" x2="418" y2="115" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="418" y1="115" x2="432" y2="102" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="365" y1="110" x2="345" y2="145" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <text x="375" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">Feather-light arm and head glide, zero tingling</text>
</svg>
