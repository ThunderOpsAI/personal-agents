<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="500" height="240" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="12" x2="250" y2="228" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SETUP</text>
  <text x="274" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">ACTIVE MOVEMENT</text>
  
  <!-- Title Badge -->
  <rect x="24" y="38" width="208" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
  <text x="32" y="53" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">SIDE-LYING CLAMSHELL &amp; GLUTE</text>
  
  <!-- Left Panel: Side-Lying Stacked Setup -->
  <line x1="45" y1="175" x2="210" y2="175" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="72" cy="155" r="9" fill="#f8fafc"/>
  <line x1="81" y1="158" x2="132" y2="162" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Stacked knees at 45 deg -->
  <line x1="132" y1="162" x2="164" y2="170" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <line x1="164" y1="170" x2="188" y2="162" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <text x="125" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Hips and knees stacked at 45°, spine neutral</text>

  <!-- Right Panel: Active Clamshell External Rotation -->
  <line x1="295" y1="175" x2="460" y2="175" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="322" cy="155" r="9" fill="#00e5ff"/>
  <line x1="331" y1="158" x2="382" y2="162" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Bottom leg anchored -->
  <line x1="382" y1="162" x2="414" y2="170" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="414" y1="170" x2="438" y2="162" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Top knee externally rotated open, heels touching -->
  <line x1="382" y1="162" x2="410" y2="136" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="410" y1="136" x2="438" y2="162" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <text x="375" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">Heels together, lift top knee without rolling pelvis</text>
</svg>
