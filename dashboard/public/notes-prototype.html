<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes UI Prototype</title>
    <style>
        /* Base Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        
        /* Floating Variant Switcher */
        #variant-switcher {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 10px;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #variant-switcher button {
            background: none;
            border: 1px solid transparent;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #variant-switcher button.active {
            background: #3b82f6;
            border-color: #60a5fa;
        }

        /* Container for all variants */
        #prototype-container { width: 100%; max-width: 800px; padding: 20px; }

        /* State display */
        #state-display {
            margin-top: 40px;
            padding: 20px;
            background: #1e293b;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            width: 100%;
            max-width: 800px;
            border: 1px dashed #475569;
            color: #94a3b8;
        }

        /* ========================================================
           VARIANT 1: Google Keep Style (Expandable Card)
           ======================================================== */
        .v1-container {
            width: 100%; max-width: 600px; margin: 0 auto;
            background: #202124; border: 1px solid #5f6368;
            border-radius: 8px; overflow: hidden;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.6);
            transition: box-shadow 0.2s;
        }
        .v1-container:focus-within { box-shadow: 0 1px 3px 1px rgba(0,0,0,0.6); border-color: #8ab4f8; }
        .v1-collapsed { display: flex; align-items: center; padding: 12px 16px; cursor: text; }
        .v1-collapsed input { background: transparent; border: none; color: #e8eaed; font-size: 16px; outline: none; width: 100%; }
        
        .v1-expanded { display: none; padding: 12px 16px; flex-direction: column; gap: 10px; }
        .v1-active .v1-collapsed { display: none; }
        .v1-active .v1-expanded { display: flex; }
        
        .v1-expanded input.title { background: transparent; border: none; color: #e8eaed; font-size: 18px; font-weight: 500; outline: none; }
        .v1-expanded textarea.body { background: transparent; border: none; color: #e8eaed; font-size: 14px; outline: none; resize: none; min-height: 80px; }
        .v1-tools { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .v1-tools-left { display: flex; gap: 10px; }
        .v1-icon-btn { background: none; border: none; color: #9aa0a6; cursor: pointer; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
        .v1-icon-btn:hover { background: rgba(255,255,255,0.04); color: #e8eaed; }
        .v1-close-btn { background: none; border: none; color: #e8eaed; cursor: pointer; font-weight: 500; font-size: 14px; padding: 8px 24px; border-radius: 4px; }
        .v1-close-btn:hover { background: rgba(255,255,255,0.04); }

        /* ========================================================
           VARIANT 2: Notion/Apple Notes (Split Pane)
           ======================================================== */
        .v2-container {
            display: flex; height: 500px; background: #ffffff; color: #333;
            border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .v2-sidebar { width: 250px; background: #f5f5f5; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
        .v2-sidebar-header { padding: 15px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
        .v2-new-btn { background: none; border: none; color: #007aff; cursor: pointer; font-size: 20px; }
        .v2-notes-list { flex: 1; overflow-y: auto; }
        .v2-note-item { padding: 15px; border-bottom: 1px solid #e0e0e0; cursor: pointer; }
        .v2-note-item:hover { background: #e8e8e8; }
        .v2-note-item.active { background: #e0e0e0; }
        .v2-note-item strong { display: block; font-size: 14px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .v2-note-item span { color: #888; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        
        .v2-editor { flex: 1; display: flex; flex-direction: column; padding: 40px; }
        .v2-editor input.title { font-size: 28px; font-weight: 700; border: none; outline: none; margin-bottom: 20px; color: #333; }
        .v2-editor textarea.body { flex: 1; font-size: 16px; line-height: 1.6; border: none; outline: none; resize: none; color: #444; }

        /* ========================================================
           VARIANT 3: Rumble OS Cyberpunk Integrated
           ======================================================== */
        .v3-container {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px;
            backdrop-filter: blur(16px);
            padding: 24px;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.1), inset 0 0 20px rgba(255,255,255,0.02);
        }
        .v3-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .v3-title { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: #8b5cf6; font-weight: 600; display: flex; align-items: center; gap: 8px;}
        .v3-title::before { content: ''; display: block; width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }
        
        .v3-input-group { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .v3-input-title { width: 100%; background: transparent; border: none; color: #fff; font-size: 18px; outline: none; margin-bottom: 12px; font-weight: 500; }
        .v3-input-body { width: 100%; background: transparent; border: none; color: #94a3b8; font-size: 14px; outline: none; resize: none; min-height: 100px; line-height: 1.5; }
        
        .v3-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .v3-tags { display: flex; gap: 8px; }
        .v3-tag { background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all 0.2s;}
        .v3-tag:hover, .v3-tag.active { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; }
        
        .v3-actions { display: flex; gap: 12px; }
        .v3-btn-outline { background: transparent; border: 1px solid #475569; color: #cbd5e1; padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .v3-btn-outline:hover { background: rgba(255,255,255,0.05); }
        .v3-btn-primary { background: linear-gradient(135deg, #8b5cf6, #3b82f6); border: none; color: #fff; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 500; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); transition: 0.2s;}
        .v3-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4); }

    </style>
</head>
<body>

    <div id="prototype-container">
        <!-- Rendered via JS -->
    </div>

    <div id="state-display">State will appear here...</div>

    <div id="variant-switcher">
        <button data-variant="v1" class="active">1. Keep Expandable</button>
        <button data-variant="v2">2. Notion Split Pane</button>
        <button data-variant="v3">3. Rumble Cyberpunk</button>
    </div>

    <script>
        // --- State ---
        let currentVariant = 'v1';
        let noteState = {
            title: '',
            body: '',
            color: 'default', // for keep
            pinned: false,
            tags: [] // for cyberpunk
        };
        let dummyNotesList = [
            { title: "Meeting Notes", body: "Discussed the new architecture...", date: "10:30 AM" },
            { title: "Groceries", body: "Milk, eggs, bread...", date: "Yesterday" }
        ];

        // --- Elements ---
        const container = document.getElementById('prototype-container');
        const stateDisplay = document.getElementById('state-display');
        const switcherBtns = document.querySelectorAll('#variant-switcher button');

        // --- Renderers ---
        const renderers = {
            v1: () => {
                container.innerHTML = `
                    <div class="v1-container" id="v1-wrap">
                        <div class="v1-collapsed" id="v1-trigger">
                            <input type="text" placeholder="Take a note..." readonly>
                        </div>
                        <div class="v1-expanded">
                            <input type="text" class="title" placeholder="Title" id="v1-title" value="${noteState.title}">
                            <textarea class="body" placeholder="Take a note..." id="v1-body">${noteState.body}</textarea>
                            <div class="v1-tools">
                                <div class="v1-tools-left">
                                    <button class="v1-icon-btn" id="v1-pin" style="color: ${noteState.pinned ? '#8ab4f8' : '#9aa0a6'}">📌</button>
                                    <button class="v1-icon-btn" id="v1-color">🎨</button>
                                </div>
                                <button class="v1-close-btn" id="v1-close">Close</button>
                            </div>
                        </div>
                    </div>
                `;

                const wrap = document.getElementById('v1-wrap');
                const trigger = document.getElementById('v1-trigger');
                const title = document.getElementById('v1-title');
                const body = document.getElementById('v1-body');
                const closeBtn = document.getElementById('v1-close');
                const pinBtn = document.getElementById('v1-pin');

                trigger.addEventListener('click', () => {
                    wrap.classList.add('v1-active');
                    body.focus();
                });

                closeBtn.addEventListener('click', () => {
                    wrap.classList.remove('v1-active');
                    saveState();
                });

                pinBtn.addEventListener('click', () => {
                    noteState.pinned = !noteState.pinned;
                    pinBtn.style.color = noteState.pinned ? '#8ab4f8' : '#9aa0a6';
                    updateStateDisplay();
                });

                title.addEventListener('input', (e) => { noteState.title = e.target.value; updateStateDisplay(); });
                body.addEventListener('input', (e) => { noteState.body = e.target.value; updateStateDisplay(); });
            },

            v2: () => {
                container.innerHTML = `
                    <div class="v2-container">
                        <div class="v2-sidebar">
                            <div class="v2-sidebar-header">
                                <h3>Notes</h3>
                                <button class="v2-new-btn">📝</button>
                            </div>
                            <div class="v2-notes-list">
                                <div class="v2-note-item active">
                                    <strong>${noteState.title || 'New Note'}</strong>
                                    <span>${noteState.body || 'No additional text'}</span>
                                </div>
                                ${dummyNotesList.map(n => `
                                    <div class="v2-note-item">
                                        <strong>${n.title}</strong>
                                        <span>${n.body}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="v2-editor">
                            <input type="text" class="title" placeholder="Untitled" id="v2-title" value="${noteState.title}">
                            <textarea class="body" placeholder="Start typing here..." id="v2-body">${noteState.body}</textarea>
                        </div>
                    </div>
                `;

                const title = document.getElementById('v2-title');
                const body = document.getElementById('v2-body');

                title.addEventListener('input', (e) => { 
                    noteState.title = e.target.value; 
                    document.querySelector('.v2-note-item.active strong').innerText = e.target.value || 'New Note';
                    updateStateDisplay(); 
                });
                body.addEventListener('input', (e) => { 
                    noteState.body = e.target.value; 
                    document.querySelector('.v2-note-item.active span').innerText = e.target.value || 'No additional text';
                    updateStateDisplay(); 
                });
            },

            v3: () => {
                container.innerHTML = `
                    <div class="v3-container">
                        <div class="v3-header">
                            <div class="v3-title">Rumble Memory Core</div>
                            <button class="v3-icon-btn" id="v3-pin" style="background:none;border:none;cursor:pointer;font-size:18px;opacity:${noteState.pinned?1:0.5}">📌</button>
                        </div>
                        <div class="v3-input-group">
                            <input type="text" class="v3-input-title" placeholder="Note Identity..." id="v3-title" value="${noteState.title}">
                            <textarea class="v3-input-body" placeholder="Capture memory block..." id="v3-body">${noteState.body}</textarea>
                        </div>
                        <div class="v3-footer">
                            <div class="v3-tags">
                                <span class="v3-tag ${noteState.tags.includes('personal') ? 'active' : ''}" data-tag="personal">#personal</span>
                                <span class="v3-tag ${noteState.tags.includes('medical') ? 'active' : ''}" data-tag="medical">#medical</span>
                                <span class="v3-tag ${noteState.tags.includes('work') ? 'active' : ''}" data-tag="work">#work</span>
                            </div>
                            <div class="v3-actions">
                                <button class="v3-btn-outline" id="v3-discard">Discard</button>
                                <button class="v3-btn-primary" id="v3-save">Commit to Core</button>
                            </div>
                        </div>
                    </div>
                `;

                const title = document.getElementById('v3-title');
                const body = document.getElementById('v3-body');
                const pin = document.getElementById('v3-pin');
                const tags = document.querySelectorAll('.v3-tag');
                
                title.addEventListener('input', (e) => { noteState.title = e.target.value; updateStateDisplay(); });
                body.addEventListener('input', (e) => { noteState.body = e.target.value; updateStateDisplay(); });
                
                pin.addEventListener('click', () => {
                    noteState.pinned = !noteState.pinned;
                    pin.style.opacity = noteState.pinned ? 1 : 0.5;
                    updateStateDisplay();
                });

                tags.forEach(t => t.addEventListener('click', (e) => {
                    const tag = e.target.dataset.tag;
                    if(noteState.tags.includes(tag)) {
                        noteState.tags = noteState.tags.filter(x => x !== tag);
                        e.target.classList.remove('active');
                    } else {
                        noteState.tags.push(tag);
                        e.target.classList.add('active');
                    }
                    updateStateDisplay();
                }));
            }
        };

        // --- Controller ---
        function updateStateDisplay() {
            stateDisplay.innerText = "CURRENT IN-MEMORY STATE:\n" + JSON.stringify(noteState, null, 2);
        }

        function saveState() {
            // Emulate saving
            updateStateDisplay();
        }

        function switchVariant(v) {
            currentVariant = v;
            // reset state for fresh feel
            noteState = { title: '', body: '', color: 'default', pinned: false, tags: [] };
            
            switcherBtns.forEach(btn => {
                if(btn.dataset.variant === v) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            
            renderers[v]();
            updateStateDisplay();
        }

        switcherBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                switchVariant(e.target.dataset.variant);
            });
        });

        // Init
        switchVariant('v1');

    </script>
</body>
</html>
