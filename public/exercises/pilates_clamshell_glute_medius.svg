<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <title>Side-Lying Clamshell &amp; Glute Medius</title>
  <desc>Clinical Pilates side-lying clamshell showing stacked hips, 45 degree knee flexion, and targeted gluteus medius external rotation without pelvic roll.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="500" height="240" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="12" x2="250" y2="228" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SETUP: STACKED NEUTRAL</text>
  <text x="274" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">ACTIVE EXTERNAL ROTATION</text>
  
  <!-- Title Badge -->
  <rect x="24" y="38" width="220" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
  <text x="32" y="53" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">PILATES CLAMSHELL (GLUTE MEDIUS)</text>
  
  <!-- Left Panel: Setup -->
  <line x1="45" y1="180" x2="210" y2="180" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Head supported in line with spine -->
  <circle cx="72" cy="156" r="9" fill="#f8fafc"/>
  <line x1="68" y1="168" x2="105" y2="168" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Neutral Spine / Torso -->
  <line x1="81" y1="158" x2="135" y2="162" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Stacked Hips & Knees at 45 deg -->
  <line x1="135" y1="162" x2="168" y2="172" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Lower legs bent with feet aligned -->
  <line x1="168" y1="172" x2="192" y2="162" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Alignment guide -->
  <circle cx="135" cy="162" r="3" fill="#38bdf8"/>
  <text x="125" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Hips stacked perpendicular to mat, knees 45°, feet glued</text>

  <!-- Right Panel: Active External Rotation -->
  <line x1="295" y1="180" x2="460" y2="180" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Head supported -->
  <circle cx="322" cy="156" r="9" fill="#00e5ff"/>
  <line x1="318" y1="168" x2="355" y2="168" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Neutral Spine / Torso (no backward tilt) -->
  <line x1="331" y1="158" x2="385" y2="162" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Bottom leg anchored on floor -->
  <line x1="385" y1="162" x2="418" y2="174" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="418" y1="174" x2="442" y2="164" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Top knee rotated upward, feet remain in contact -->
  <line x1="385" y1="162" x2="415" y2="136" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="415" y1="136" x2="442" y2="164" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Arc showing clean rotation without pelvic roll -->
  <path d="M 420 166 A 14 14 0 0 0 417 144" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="385" cy="162" r="3" fill="#38bdf8"/>
  <text x="375" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Rotate top knee open 30–45° without letting pelvis roll back</text>
</svg>
