<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <title>Single Leg Stretch &amp; Core Control</title>
  <desc>Clinical Pilates single leg stretch with supported/grounded head, 45 degree alternating leg reach, and hands stabilizing opposite knee to maintain lumbopelvic neutrality.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="500" height="240" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="12" x2="250" y2="228" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SETUP: SUPINE NEUTRAL</text>
  <text x="274" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">ACTIVE ALTERNATING EXTENSION</text>
  
  <!-- Title Badge -->
  <rect x="24" y="38" width="220" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
  <text x="32" y="53" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">PILATES SINGLE LEG STRETCH</text>
  
  <!-- Left Panel: Setup -->
  <line x1="45" y1="180" x2="215" y2="180" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Head supported on mat/pillow -->
  <circle cx="70" cy="168" r="9" fill="#f8fafc"/>
  <line x1="79" y1="171" x2="135" y2="171" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Both knees bent in crook lying preparation -->
  <line x1="135" y1="171" x2="160" y2="140" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <line x1="160" y1="140" x2="185" y2="180" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <text x="125" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Head flat on mat, deep abdominal engagement, neutral spine</text>

  <!-- Right Panel: Active Single Leg Stretch -->
  <line x1="295" y1="180" x2="465" y2="180" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Head grounded/supported (preventing cervical strain) -->
  <circle cx="320" cy="168" r="9" fill="#00e5ff"/>
  <line x1="329" y1="171" x2="385" y2="171" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Bent leg guided toward chest (hands softly on shin) -->
  <line x1="385" y1="171" x2="375" y2="135" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="375" y1="135" x2="395" y2="135" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Arms reaching to guide bent knee -->
  <line x1="340" y1="171" x2="380" y2="142" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Opposite leg extended long at 45 degrees -->
  <line x1="385" y1="171" x2="445" y2="142" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Stable pelvis indicator -->
  <circle cx="385" cy="171" r="3" fill="#38bdf8"/>
  <text x="375" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Reach leg at 45°, guide opposite knee; keep lumbar stable and flat</text>
</svg>
