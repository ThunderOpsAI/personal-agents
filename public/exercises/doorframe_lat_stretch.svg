<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="500" height="240" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="12" x2="250" y2="228" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SETUP</text>
  <text x="274" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">ACTIVE MOVEMENT</text>
  
  <!-- Title Badge -->
  <rect x="24" y="38" width="206" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
  <text x="32" y="53" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">DOORFRAME LATISSIMUS HANG</text>
  
  <!-- Left Panel: Doorframe Grip Setup -->
  <line x1="175" y1="68" x2="175" y2="195" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="65" y1="195" x2="195" y2="195" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <circle cx="132" cy="84" r="10" fill="#f8fafc"/>
  <line x1="132" y1="94" x2="132" y2="142" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <line x1="132" y1="100" x2="173" y2="90" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <line x1="132" y1="142" x2="132" y2="193" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <text x="125" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Hold doorframe at shoulder-to-overhead height</text>

  <!-- Right Panel: Active Hip Hinge Back & Lat Lengthening -->
  <line x1="425" y1="68" x2="425" y2="195" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="305" y1="195" x2="445" y2="195" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <circle cx="362" cy="108" r="10" fill="#00e5ff"/>
  <!-- Long overhead reach to doorframe -->
  <line x1="368" y1="112" x2="423" y2="90" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <!-- Hinged torso -->
  <line x1="362" y1="116" x2="328" y2="145" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Soft knees with hips pushed back -->
  <line x1="328" y1="145" x2="352" y2="170" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="352" y1="170" x2="352" y2="193" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <text x="375" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">Hinge hips back, lengthen side body and lats</text>
</svg>
