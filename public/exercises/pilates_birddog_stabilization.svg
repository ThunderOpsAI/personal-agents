<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <title>Quadruped Bird-Dog Stabilization</title>
  <desc>Clinical Pilates and McGill Quadruped Bird-Dog showing four-point kneeling alignment, contralateral arm and leg reach, and cervical spine neutral in line with torso.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="500" height="240" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="12" x2="250" y2="228" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SETUP: 4-POINT QUADRUPED</text>
  <text x="274" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">CONTRALATERAL REACH</text>
  
  <!-- Title Badge -->
  <rect x="24" y="38" width="225" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
  <text x="32" y="53" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">BIRD-DOG STABILIZATION</text>
  
  <!-- Left Panel: Setup -->
  <line x1="45" y1="180" x2="215" y2="180" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Head in line with spine -->
  <circle cx="85" cy="126" r="8" fill="#f8fafc"/>
  <line x1="93" y1="130" x2="160" y2="130" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Arms under shoulders -->
  <line x1="105" y1="130" x2="105" y2="180" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Knees under hips -->
  <line x1="155" y1="130" x2="155" y2="180" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Feet resting -->
  <line x1="155" y1="180" x2="180" y2="180" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <text x="125" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Wrists under shoulders, knees under hips, spine completely flat</text>

  <!-- Right Panel: Contralateral Reach -->
  <line x1="295" y1="180" x2="465" y2="180" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Head neutral, eyes looking down at mat -->
  <circle cx="340" cy="126" r="8" fill="#00e5ff"/>
  <line x1="348" y1="130" x2="415" y2="130" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Supporting arm on mat -->
  <line x1="365" y1="130" x2="365" y2="180" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Reaching arm parallel to floor -->
  <line x1="365" y1="130" x2="305" y2="130" stroke="#00e5ff" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Supporting knee on mat -->
  <line x1="410" y1="130" x2="410" y2="180" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Reaching opposite leg straight back in line with torso -->
  <line x1="410" y1="130" x2="465" y2="130" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="388" cy="130" r="3" fill="#38bdf8"/>
  <text x="375" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Reach opposite arm and leg; neck in line with spine, hips level</text>
</svg>
