<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <title>Spine Twist &amp; Thoracic Mobility</title>
  <desc>Clinical Pilates seated spine twist showing tall neutral spine, hands or ball hugged to chest, and pure thoracic rib rotation with pelvis anchored.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="500" height="240" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="12" x2="250" y2="228" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SETUP: SEATED TALL</text>
  <text x="274" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">THORACIC RIB ROTATION</text>
  
  <!-- Title Badge -->
  <rect x="24" y="38" width="225" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
  <text x="32" y="53" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">PILATES SPINE TWIST (SEATED)</text>
  
  <!-- Left Panel: Seated Setup -->
  <line x1="45" y1="180" x2="215" y2="180" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Head neutral above spine -->
  <circle cx="125" cy="100" r="8" fill="#f8fafc"/>
  <!-- Tall upright spine -->
  <line x1="125" y1="108" x2="125" y2="165" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Seated crossed legs or long on mat -->
  <line x1="125" y1="165" x2="165" y2="180" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <line x1="125" y1="165" x2="85" y2="180" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- Arms folded across chest hugging ball -->
  <circle cx="125" cy="130" r="10" fill="#38bdf8" opacity="0.4"/>
  <path d="M 115 130 Q 125 142 135 130" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <text x="125" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Sit upright on sit-bones, hug ball to sternum, spine tall</text>

  <!-- Right Panel: Thoracic Rotation -->
  <line x1="295" y1="180" x2="465" y2="180" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Head turns with sternum -->
  <circle cx="375" cy="100" r="8" fill="#00e5ff"/>
  <!-- Torso rotates from mid-back -->
  <line x1="375" y1="108" x2="375" y2="165" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Pelvis stays anchored flat -->
  <line x1="375" y1="165" x2="415" y2="180" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="375" y1="165" x2="335" y2="180" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <!-- Angled chest arms rotating 20-30 degrees -->
  <circle cx="382" cy="130" r="10" fill="#38bdf8" opacity="0.4"/>
  <path d="M 368 126 Q 380 142 392 134" fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <!-- Rotation arrow -->
  <path d="M 358 116 Q 375 110 392 116" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="375" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Exhale rotate ribs 20–30°; pelvis remains rock solid on floor</text>
</svg>
