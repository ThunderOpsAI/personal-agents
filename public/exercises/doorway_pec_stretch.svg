<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="500" height="240" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="12" x2="250" y2="228" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SETUP</text>
  <text x="274" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">ACTIVE MOVEMENT</text>
  
  <!-- Title Badge -->
  <rect x="24" y="38" width="210" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
  <text x="32" y="53" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">DOORWAY PECTORALIS STRETCH</text>
  
  <!-- Left Panel: 90-Degree Forearm Setup on Doorframe -->
  <line x1="168" y1="68" x2="168" y2="195" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="122" cy="84" r="10" fill="#f8fafc"/>
  <line x1="122" y1="94" x2="122" y2="145" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- 90-degree arm against doorframe -->
  <line x1="122" y1="108" x2="164" y2="108" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <line x1="164" y1="108" x2="164" y2="78" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <line x1="122" y1="145" x2="112" y2="193" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <line x1="122" y1="145" x2="132" y2="193" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <text x="125" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Forearm anchored on doorframe at 90° or 120°</text>

  <!-- Right Panel: Step Through Anterior Chest Opener -->
  <line x1="398" y1="68" x2="398" y2="195" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="372" cy="84" r="10" fill="#00e5ff"/>
  <line x1="372" y1="94" x2="372" y2="145" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Forearm stays on doorframe while chest steps gently forward -->
  <line x1="372" y1="108" x2="395" y2="102" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="395" y1="102" x2="395" y2="74" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="372" y1="145" x2="352" y2="193" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="372" y1="145" x2="388" y2="193" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <text x="375" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">Step gently forward to open anterior chest wall</text>
</svg>
